<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06060a" />
    <title>PandaX Code | Diseño y desarrollo web</title>
    <!-- Para la vista previa al compartir el enlace: WhatsApp y las redes no ejecutan JavaScript,
         así que estas etiquetas deben estar en el HTML (la imagen la añade vite-plugin-seo.js) -->
    <meta property="og:title" content="PandaX Code | Diseño y desarrollo web" />
    <meta property="og:description" content="Diseñamos y desarrollamos sitios web modernos, rápidos y memorables que hacen crecer tu negocio." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />
    <meta name="description" content="Diseñamos y desarrollamos sitios web modernos, rápidos y memorables que hacen crecer tu negocio." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Sólo los pesos que usa la web: Space Grotesk para títulos, Inter para texto,
         JetBrains Mono para etiquetas técnicas y Silkscreen para las etiquetas pixel de Retos -->
    <!-- Se carga sin bloquear el primer pintado: mientras llega, el texto sale con la fuente
         del sistema (display=swap) en vez de dejar la pantalla en blanco -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Silkscreen&family=Space+Grotesk:wght@600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Silkscreen&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Silkscreen&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
